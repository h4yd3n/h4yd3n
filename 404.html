<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Not found · Hayden Lee</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<style>
  :root{--wall:#F1ECDB;--ink:#29261F;--muted:#5F594B;--butter:#FCE685;--tape:#35597F}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--wall);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
    background-image:radial-gradient(circle at 1px 1px,rgba(41,38,31,.035) 1px,transparent 0);background-size:22px 22px}
  main{position:relative;background:var(--butter);border-radius:12px;padding:22px 20px 18px;max-width:300px;transform:rotate(-1deg);
    box-shadow:0 1px 0 rgba(41,38,31,.04),0 14px 26px -18px rgba(41,38,31,.5)}
  main::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:46px;height:15px;border-radius:2px;background:var(--tape);opacity:.92}
  p.pad{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:20px;font-weight:800;margin-top:6px}
  p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}
  a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<main>
  <p class="pad">404</p>
  <h1>This note fell off the wall.</h1>
  <p>Nothing lives at this address. <a href="/">Back to the wall</a>.</p>
</main>
</body>
</html>
